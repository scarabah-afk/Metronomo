<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0c0c0f" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Metrónomo Programable</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0c0c0f; --surface: #161620; --surface2: #1e1e2a;
      --border: #2a2a3a; --gold: #e8c14a; --gold-dim: #e8c14a22;
      --text: #ede9e0; --muted: #666; --dim: #333;
    }
    html, body { background: var(--bg); color: var(--text); font-family: 'Courier New', monospace; min-height: 100vh; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
    body { display: flex; flex-direction: column; align-items: center; padding: 28px 16px 60px; max-width: 480px; margin: 0 auto; }

    .header { text-align: center; margin-bottom: 20px; }
    .header-sub { font-size: 9px; letter-spacing: 0.35em; color: var(--muted); text-transform: uppercase; margin-bottom: 4px; }
    .header-title { font-size: 32px; font-weight: bold; }

    .pendulum-wrap { width: 160px; height: 120px; position: relative; margin-bottom: 16px; display: flex; align-items: flex-end; justify-content: center; }
    .pendulum-rod { width: 3px; height: 95px; background: #444; border-radius: 2px; position: absolute; bottom: 0; left: 50%; transform-origin: bottom center; transform: translateX(-50%) rotate(0deg); transition: transform 0.3s ease; }
    .pendulum-ball { width: 22px; height: 22px; border-radius: 50%; background: #2a2a2a; position: absolute; top: -4px; left: 50%; transform: translateX(-50%); transition: background 0.05s, box-shadow 0.05s; }
    .pendulum-base { width: 48px; height: 10px; background: #2a2a2a; border-radius: 5px; position: absolute; bottom: 0; }

    .beats { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; min-height: 24px; flex-wrap: wrap; justify-content: center; }
    .beat-dot { border-radius: 50%; background: #1e1e26; transition: background 0.04s, box-shadow 0.04s; flex-shrink: 0; }

    /* Subdivision dots row */
    .subdiv-dots { display: flex; gap: 5px; margin-bottom: 18px; align-items: center; min-height: 12px; flex-wrap: wrap; justify-content: center; }
    .subdiv-dot { width: 7px; height: 7px; border-radius: 50%; background: #1e1e26; transition: background 0.04s; flex-shrink: 0; }
    .subdiv-dot.on { background: #e8c14a88; }

    .bpm-row { display: flex; align-items: center; gap: 16px; margin-bottom: 6px; }
    .bpm-btn { width: 46px; height: 46px; background: var(--surface); border: 1px solid var(--border); color: var(--text); font-size: 22px; cursor: pointer; border-radius: 9px; display: flex; align-items: center; justify-content: center; }
    .bpm-btn:active { background: var(--surface2); }
    .bpm-center { text-align: center; min-width: 130px; }
    .bpm-number { font-size: 76px; font-weight: bold; line-height: 1; font-variant-numeric: tabular-nums; }
    .bpm-name { font-size: 10px; color: var(--muted); letter-spacing: 0.18em; text-transform: uppercase; margin-top: 2px; }

    input[type=range] { width: 270px; margin-bottom: 18px; accent-color: var(--gold); cursor: pointer; -webkit-appearance: none; appearance: none; height: 4px; background: var(--border); border-radius: 2px; outline: none; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: var(--gold); cursor: pointer; }

    .presets { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-bottom: 16px; }
    .chip { padding: 5px 12px; border-radius: 7px; font-size: 12px; font-family: 'Courier New', monospace; cursor: pointer; background: var(--surface); border: 1px solid var(--border); color: var(--muted); transition: all 0.15s; }
    .chip.active { background: var(--gold-dim); border-color: var(--gold); color: var(--gold); }
    .chip:active { opacity: 0.7; }

    /* Sound selector */
    .section-label { font-size: 9px; color: var(--muted); letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 8px; text-align: center; }
    .sound-row { display: flex; gap: 8px; margin-bottom: 16px; justify-content: center; }
    .sound-chip { padding: 7px 16px; border-radius: 8px; font-size: 12px; font-family: 'Courier New', monospace; cursor: pointer; background: var(--surface); border: 1px solid var(--border); color: var(--muted); transition: all 0.15s; }
    .sound-chip.active { background: #4a88e822; border-color: #4a88e8; color: #4a88e8; }

    /* Subdivision selector */
    .subdiv-row { display: flex; gap: 8px; margin-bottom: 18px; justify-content: center; flex-wrap: wrap; }
    .subdiv-chip { padding: 7px 14px; border-radius: 8px; font-size: 12px; font-family: 'Courier New', monospace; cursor: pointer; background: var(--surface); border: 1px solid var(--border); color: var(--muted); transition: all 0.15s; }
    .subdiv-chip.active { background: #a84ae822; border-color: #a84ae8; color: #c070ff; }

    .sigs { display: flex; gap: 7px; margin-bottom: 22px; flex-wrap: wrap; justify-content: center; }

    .controls { display: flex; gap: 14px; margin-bottom: 20px; align-items: center; }
    .play-btn { width: 82px; height: 82px; border-radius: 50%; background: var(--surface); border: 2px solid #444; color: var(--text); font-size: 28px; cursor: pointer; transition: all 0.18s; display: flex; align-items: center; justify-content: center; }
    .play-btn.playing { background: var(--gold); border-color: var(--gold); color: #0c0c0f; box-shadow: 0 0 28px #e8c14a55; }
    .tap-btn { height: 82px; padding: 0 20px; border-radius: 14px; background: var(--surface); border: 1px solid #444; color: var(--text); font-size: 13px; letter-spacing: 0.1em; font-family: 'Courier New', monospace; cursor: pointer; line-height: 1.4; text-align: center; }

    .kbd-hint { font-size: 9px; color: #2e2e2e; margin-bottom: 26px; letter-spacing: 0.08em; text-align: center; }

    /* Program */
    .prog-toggle { width: 100%; padding: 13px 0; background: var(--surface); border: 1px solid var(--border); color: var(--muted); cursor: pointer; border-radius: 10px; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; font-family: 'Courier New', monospace; }
    .prog-body { background: #0f0f18; border: 1px solid #22222e; border-top: none; border-radius: 0 0 10px 10px; padding: 18px; display: none; }
    .prog-body.open { display: block; }
    .prog-status { background: #e8c14a08; border: 1px solid #e8c14a2a; border-radius: 8px; padding: 10px 14px; margin-bottom: 14px; }
    .prog-status-title { color: var(--gold); font-weight: bold; font-size: 12px; margin-bottom: 3px; }
    .prog-status-info { font-size: 11px; color: #888; }
    .prog-step { background: #181824; border: 1px solid #26263a; border-radius: 10px; padding: 14px; margin-bottom: 10px; }
    .prog-step-header { display: flex; justify-content: space-between; margin-bottom: 10px; align-items: center; }
    .prog-step-label { font-size: 9px; color: #555; letter-spacing: 0.14em; text-transform: uppercase; }
    .prog-step-remove { background: none; border: none; color: #444; cursor: pointer; font-size: 15px; }
    .prog-step-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .prog-field label { font-size: 8px; color: #444; text-transform: uppercase; letter-spacing: 0.1em; display: block; margin-bottom: 3px; }
    .prog-field input[type=number] { width: 100%; background: #0c0c14; border: 1px solid #2a2a3a; border-radius: 7px; padding: 6px 10px; color: var(--text); font-size: 15px; font-family: 'Courier New', monospace; }
    .prog-field select { width: 100%; background: #0c0c14; border: 1px solid #2a2a3a; border-radius: 7px; padding: 6px 10px; color: var(--text); font-size: 13px; font-family: 'Courier New', monospace; }
    .prog-step-hint { margin-top: 8px; font-size: 9px; color: #444; }
    .prog-add { width: 100%; margin-bottom: 10px; padding: 9px 0; background: none; border: 1px dashed #2a2a3a; border-radius: 8px; color: #555; cursor: pointer; font-size: 12px; font-family: 'Courier New', monospace; }
    .prog-start { width: 100%; padding: 13px 0; background: var(--gold); border: none; border-radius: 8px; color: #0c0c0f; font-weight: bold; cursor: pointer; font-size: 14px; letter-spacing: 0.06em; font-family: 'Courier New', monospace; }
    .prog-stop { width: 100%; padding: 13px 0; background: #1a0e0e; border: 1px solid #882222; border-radius: 8px; color: #ff5555; font-weight: bold; cursor: pointer; font-size: 14px; font-family: 'Courier New', monospace; }

    .divider { width: 100%; height: 1px; background: var(--border); margin: 4px 0 14px; }
  </style>
</head>
<body>

<div class="header">
  <div class="header-sub">Metrónomo Programable</div>
  <div class="header-title">♩ TEMPO</div>
</div>

<div class="pendulum-wrap">
  <div class="pendulum-rod" id="rod">
    <div class="pendulum-ball" id="ball"></div>
  </div>
  <div class="pendulum-base"></div>
</div>

<div class="beats" id="beats"></div>
<div class="subdiv-dots" id="subdiv-dots"></div>

<div class="bpm-row">
  <button class="bpm-btn" id="bpm-down">−</button>
  <div class="bpm-center">
    <div class="bpm-number" id="bpm-display">100</div>
    <div class="bpm-name" id="tempo-name">Andante</div>
  </div>
  <button class="bpm-btn" id="bpm-up">+</button>
</div>

<input type="range" id="bpm-slider" min="30" max="250" value="100" />

<div class="presets" id="presets"></div>

<!-- Sound -->
<div class="section-label">Sonido</div>
<div class="sound-row" id="sound-row"></div>

<!-- Subdivision -->
<div class="section-label">Subdivisión</div>
<div class="subdiv-row" id="subdiv-row"></div>

<div class="divider"></div>

<!-- Time signatures -->
<div class="section-label">Compás</div>
<div class="sigs" id="sigs"></div>

<div class="controls">
  <button class="play-btn" id="play-btn">▶</button>
  <button class="tap-btn" id="tap-btn">TAP<br><span style="font-size:9px;color:#666">TEMPO</span></button>
</div>

<div class="kbd-hint">ESPACIO = play/stop · T = tap · ↑↓ = ±1 BPM</div>

<div style="width:100%;max-width:500px">
  <button class="prog-toggle" id="prog-toggle">▼ &nbsp; Programación de Tempo</button>
  <div class="prog-body" id="prog-body">
    <div class="prog-status" id="prog-status" style="display:none"></div>
    <div id="prog-steps"></div>
    <button class="prog-add" id="prog-add">+ Agregar paso</button>
    <button class="prog-start" id="prog-action">▶ Iniciar programa</button>
  </div>
</div>

<script>
// ── State ─────────────────────────────────────────────────────────────────────
let bpm = 100;
let isPlaying = false;
let currentBeat = 0;
let currentSubdiv = 0; // subdivision tick within beat
let sigBeats = 4;
let sigIdx = 0;
let soundIdx = 0;   // 0=click, 1=woodblock, 2=clave
let subdivIdx = 0;  // 0=none, 1=8ths, 2=triplets, 3=16ths
let tapTimes = [];
let pendulumDir = 0;
let audioCtx = null;
let nextBeatTime = 0;
let schedulerInterval = null;
let isPlayingRef = false;
let programActive = false;
let programStepIdx = 0;
let programTimer = 0;
let programCurrentBpm = 80;
let programInterval = null;
let programSteps = [{ startBpm: 80, endBpm: 120, stepBpm: 5, direction: 'up', intervalMin: 2 }];
let progOpen = false;

const SIGNATURES = [
  { label: "4/4", beats: 4 }, { label: "3/4", beats: 3 },
  { label: "6/8", beats: 6 }, { label: "2/4", beats: 2 }, { label: "5/4", beats: 5 },
];
const PRESETS = [40, 60, 72, 80, 96, 108, 120, 132, 144, 160];
const TEMPO_NAMES = [
  { name: "Largo", max: 60 }, { name: "Adagio", max: 76 },
  { name: "Andante", max: 108 }, { name: "Moderato", max: 120 },
  { name: "Allegro", max: 168 }, { name: "Presto", max: 208 },
];
const SOUNDS = ["Click", "Woodblock", "Clave"];
const SUBDIVS = [
  { label: "Ninguna", divs: 1 },
  { label: "♩ Corcheas ×2", divs: 2 },
  { label: "♩ Tresillos ×3", divs: 3 },
  { label: "♩ Semicorcheas ×4", divs: 4 },
];

// ── Audio ─────────────────────────────────────────────────────────────────────
function ensureCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

// CLICK sound
function makeClick(time, accent) {
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.connect(g); g.connect(audioCtx.destination);
  o.type = 'sine';
  o.frequency.value = accent === 'strong' ? 1500 : accent === 'beat' ? 900 : 650;
  g.gain.setValueAtTime(0, time);
  g.gain.linearRampToValueAtTime(accent === 'strong' ? 1.0 : accent === 'beat' ? 0.5 : 0.25, time + 0.002);
  g.gain.exponentialRampToValueAtTime(0.0001, time + (accent === 'strong' ? 0.05 : 0.035));
  o.start(time); o.stop(time + 0.06);
}

// WOODBLOCK sound
function makeWoodblock(time, accent) {
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.connect(g); g.connect(audioCtx.destination);
  o.type = 'square';
  o.frequency.value = accent === 'strong' ? 800 : accent === 'beat' ? 500 : 350;
  g.gain.setValueAtTime(0, time);
  g.gain.linearRampToValueAtTime(accent === 'strong' ? 0.7 : accent === 'beat' ? 0.4 : 0.2, time + 0.001);
  g.gain.exponentialRampToValueAtTime(0.0001, time + 0.03);
  o.start(time); o.stop(time + 0.04);
}

// CLAVE sound (two layered tones)
function makeClave(time, accent) {
  [700, 1400].forEach((freq, i) => {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.type = 'triangle';
    o.frequency.value = accent === 'strong' ? freq * 1.3 : accent === 'beat' ? freq : freq * 0.7;
    const vol = accent === 'strong' ? 0.6 : accent === 'beat' ? 0.35 : 0.18;
    g.gain.setValueAtTime(0, time);
    g.gain.linearRampToValueAtTime(i === 0 ? vol : vol * 0.5, time + 0.001);
    g.gain.exponentialRampToValueAtTime(0.0001, time + 0.04);
    o.start(time); o.stop(time + 0.05);
  });
}

function playSound(time, accent) {
  if (soundIdx === 0) makeClick(time, accent);
  else if (soundIdx === 1) makeWoodblock(time, accent);
  else makeClave(time, accent);
}

function runScheduler() {
  if (!isPlayingRef || !audioCtx) return;
  const LOOKAHEAD = 0.1;
  const subdivCount = SUBDIVS[subdivIdx].divs;
  const beatDur = 60.0 / bpm;
  const subdivDur = beatDur / subdivCount;

  while (nextBeatTime < audioCtx.currentTime + LOOKAHEAD) {
    const t = nextBeatTime;
    const beat = currentBeat;
    const sub = currentSubdiv;

    // Determine accent
    let accent;
    if (sub === 0) {
      accent = beat === 0 ? 'strong' : 'beat';
    } else {
      accent = 'subdiv';
    }

    playSound(t, accent);

    const delay = Math.max(0, (t - audioCtx.currentTime) * 1000);
    setTimeout(() => {
      if (sub === 0) updateBeatUI(beat);
      updateSubdivUI(beat, sub, subdivCount);
    }, delay);

    // Advance
    currentSubdiv = (currentSubdiv + 1) % subdivCount;
    if (currentSubdiv === 0) {
      currentBeat = (currentBeat + 1) % sigBeats;
    }
    nextBeatTime += subdivDur;
  }
}

function start() {
  ensureCtx();
  currentBeat = 0; currentSubdiv = 0;
  nextBeatTime = audioCtx.currentTime + 0.05;
  isPlayingRef = true;
  schedulerInterval = setInterval(runScheduler, 25);
  isPlaying = true;
  updatePlayUI();
}

function stop() {
  isPlayingRef = false;
  clearInterval(schedulerInterval);
  isPlaying = false;
  updatePlayUI();
  resetBeatUI();
}

function togglePlay() { isPlaying ? stop() : start(); }

// ── UI ────────────────────────────────────────────────────────────────────────
function getTempoName(b) {
  for (const t of TEMPO_NAMES) if (b <= t.max) return t.name;
  return "Prestissimo";
}

function updateBpm() {
  document.getElementById('bpm-display').textContent = bpm;
  document.getElementById('tempo-name').textContent = getTempoName(bpm);
  document.getElementById('bpm-slider').value = bpm;
  document.querySelectorAll('.preset-btn').forEach(btn =>
    btn.classList.toggle('active', parseInt(btn.dataset.bpm) === bpm));
}

function updatePlayUI() {
  const btn = document.getElementById('play-btn');
  btn.textContent = isPlaying ? '■' : '▶';
  btn.classList.toggle('playing', isPlaying);
}

function updateBeatUI(beatNum) {
  pendulumDir = beatNum % 2 === 0 ? 1 : -1;
  const rod = document.getElementById('rod');
  const ball = document.getElementById('ball');
  rod.style.transform = `translateX(-50%) rotate(${pendulumDir * 24}deg)`;
  rod.style.transition = `transform ${(60 / bpm) * 0.48}s cubic-bezier(0.37,0,0.63,1)`;
  ball.style.background = beatNum === 0 ? '#e8c14a' : '#ccc';
  ball.style.boxShadow = beatNum === 0 ? '0 0 18px #e8c14a88' : 'none';

  document.querySelectorAll('.beat-dot').forEach((dot, i) => {
    dot.style.background = (i === beatNum) ? (i === 0 ? '#e8c14a' : '#ede9e0') : '#1e1e26';
    dot.style.boxShadow = (i === beatNum) ? (i === 0 ? '0 0 12px #e8c14a88' : '0 0 6px #ede9e044') : 'none';
  });
}

function updateSubdivUI(beat, sub, subdivCount) {
  const dots = document.querySelectorAll('.subdiv-dot');
  if (!dots.length) return;
  const totalIdx = beat * subdivCount + sub;
  dots.forEach((dot, i) => {
    dot.classList.toggle('on', i === totalIdx);
  });
}

function resetBeatUI() {
  const rod = document.getElementById('rod');
  rod.style.transform = 'translateX(-50%) rotate(0deg)';
  rod.style.transition = 'transform 0.3s ease';
  document.getElementById('ball').style.background = '#2a2a2a';
  document.getElementById('ball').style.boxShadow = 'none';
  document.querySelectorAll('.beat-dot').forEach(d => { d.style.background = '#1e1e26'; d.style.boxShadow = 'none'; });
  document.querySelectorAll('.subdiv-dot').forEach(d => d.classList.remove('on'));
}

function buildBeats() {
  const c = document.getElementById('beats');
  c.innerHTML = '';
  for (let i = 0; i < sigBeats; i++) {
    const d = document.createElement('div');
    d.className = 'beat-dot';
    d.style.width = d.style.height = i === 0 ? '20px' : '14px';
    d.style.border = `2px solid ${i === 0 ? '#e8c14a44' : '#333'}`;
    c.appendChild(d);
  }
}

function buildSubdivDots() {
  const c = document.getElementById('subdiv-dots');
  c.innerHTML = '';
  const divs = SUBDIVS[subdivIdx].divs;
  if (divs <= 1) return;
  const total = sigBeats * divs;
  for (let i = 0; i < total; i++) {
    const d = document.createElement('div');
    d.className = 'subdiv-dot';
    // separator between beats
    if (i > 0 && i % divs === 0) {
      const sep = document.createElement('div');
      sep.style.width = '3px';
      c.appendChild(sep);
    }
    c.appendChild(d);
  }
}

function buildPresets() {
  const c = document.getElementById('presets');
  c.innerHTML = '';
  PRESETS.forEach(v => {
    const btn = document.createElement('button');
    btn.className = 'chip preset-btn' + (v === bpm ? ' active' : '');
    btn.textContent = v; btn.dataset.bpm = v;
    btn.onclick = () => { bpm = v; updateBpm(); };
    c.appendChild(btn);
  });
}

function buildSounds() {
  const c = document.getElementById('sound-row');
  c.innerHTML = '';
  SOUNDS.forEach((s, i) => {
    const btn = document.createElement('button');
    btn.className = 'sound-chip' + (i === soundIdx ? ' active' : '');
    btn.textContent = s;
    btn.onclick = () => {
      soundIdx = i;
      document.querySelectorAll('.sound-chip').forEach((b, j) => b.classList.toggle('active', j === i));
    };
    c.appendChild(btn);
  });
}

function buildSubdivs() {
  const c = document.getElementById('subdiv-row');
  c.innerHTML = '';
  SUBDIVS.forEach((s, i) => {
    const btn = document.createElement('button');
    btn.className = 'subdiv-chip' + (i === subdivIdx ? ' active' : '');
    btn.textContent = s.label;
    btn.onclick = () => {
      subdivIdx = i;
      document.querySelectorAll('.subdiv-chip').forEach((b, j) => b.classList.toggle('active', j === i));
      currentSubdiv = 0;
      buildSubdivDots();
    };
    c.appendChild(btn);
  });
}

function buildSigs() {
  const c = document.getElementById('sigs');
  c.innerHTML = '';
  SIGNATURES.forEach((s, i) => {
    const btn = document.createElement('button');
    btn.className = 'chip' + (i === sigIdx ? ' active' : '');
    btn.textContent = s.label;
    btn.onclick = () => {
      sigIdx = i; sigBeats = s.beats; currentBeat = 0; currentSubdiv = 0;
      document.querySelectorAll('#sigs .chip').forEach((b, j) => b.classList.toggle('active', j === i));
      buildBeats(); buildSubdivDots(); resetBeatUI();
    };
    c.appendChild(btn);
  });
}

// ── Program ───────────────────────────────────────────────────────────────────
function fmtTime(s) { return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; }

function stepHint(step) {
  const diff = Math.abs(step.endBpm - step.startBpm);
  const steps = Math.ceil(diff / Math.abs(step.stepBpm));
  const arrow = step.direction === 'up' ? '↑' : '↓';
  return `${step.startBpm} ${arrow} ${step.endBpm} BPM · ${arrow}${step.stepBpm} cada ${step.intervalMin} min · ${steps} pasos · ~${(steps * step.intervalMin).toFixed(1)} min`;
}

function renderProgramSteps() {
  const c = document.getElementById('prog-steps');
  c.innerHTML = '';
  programSteps.forEach((step, i) => {
    const div = document.createElement('div');
    div.className = 'prog-step';
    div.innerHTML = `
      <div class="prog-step-header">
        <span class="prog-step-label">Paso ${i+1}</span>
        ${programSteps.length > 1 ? `<button class="prog-step-remove" data-idx="${i}">✕</button>` : ''}
      </div>
      <div class="prog-step-grid">
        <div class="prog-field"><label>BPM inicial</label><input type="number" min="30" max="250" step="1" value="${step.startBpm}" data-idx="${i}" data-field="startBpm"></div>
        <div class="prog-field"><label>BPM final</label><input type="number" min="30" max="250" step="1" value="${step.endBpm}" data-idx="${i}" data-field="endBpm"></div>
        <div class="prog-field"><label>Cambio por paso</label><input type="number" min="1" max="50" step="1" value="${step.stepBpm}" data-idx="${i}" data-field="stepBpm"></div>
        <div class="prog-field"><label>Intervalo (min)</label><input type="number" min="0.5" max="60" step="0.5" value="${step.intervalMin}" data-idx="${i}" data-field="intervalMin"></div>
        <div class="prog-field" style="grid-column:1/-1"><label>Dirección</label>
          <select data-idx="${i}" data-field="direction">
            <option value="up" ${step.direction==='up'?'selected':''}>↑ Subir BPM</option>
            <option value="down" ${step.direction==='down'?'selected':''}>↓ Bajar BPM</option>
          </select>
        </div>
      </div>
      <div class="prog-step-hint" id="hint-${i}">${stepHint(step)}</div>`;
    c.appendChild(div);
  });

  c.querySelectorAll('input[type=number], select').forEach(inp => {
    inp.oninput = inp.onchange = () => {
      const idx = parseInt(inp.dataset.idx);
      const f = inp.dataset.field;
      programSteps[idx][f] = inp.type === 'number' ? parseFloat(inp.value) : inp.value;
      const hint = document.getElementById(`hint-${idx}`);
      if (hint) hint.textContent = stepHint(programSteps[idx]);
    };
  });

  c.querySelectorAll('.prog-step-remove').forEach(btn => {
    btn.onclick = () => { programSteps.splice(parseInt(btn.dataset.idx), 1); renderProgramSteps(); };
  });
}

function updateProgStatus() {
  const el = document.getElementById('prog-status');
  if (!programActive) { el.style.display = 'none'; return; }
  el.style.display = 'block';
  const dir = programSteps[programStepIdx]?.direction === 'down' ? '↓' : '↑';
  el.innerHTML = `
    <div class="prog-status-title">▶ Programa activo — Paso ${programStepIdx+1}/${programSteps.length}</div>
    <div class="prog-status-info">BPM actual: <b>${programCurrentBpm}</b> &nbsp;${dir}&nbsp; · Siguiente cambio: <b>${fmtTime(programTimer)}</b></div>`;
}

function startProgram() {
  if (!programSteps.length) return;
  const step = programSteps[0];
  programStepIdx = 0;
  programCurrentBpm = step.startBpm;
  programTimer = Math.round(step.intervalMin * 60);
  bpm = step.startBpm; updateBpm();
  programActive = true;
  updateProgStatus();
  document.getElementById('prog-action').className = 'prog-stop';
  document.getElementById('prog-action').textContent = '■ Detener programa';

  programInterval = setInterval(() => {
    const step = programSteps[programStepIdx];
    programTimer--;
    if (programTimer <= 0) {
      const delta = step.direction === 'down' ? -Math.abs(step.stepBpm) : Math.abs(step.stepBpm);
      const nextBpm = programCurrentBpm + delta;
      const done = step.direction === 'down' ? nextBpm < step.endBpm : nextBpm > step.endBpm;

      if (done) {
        const nextIdx = programStepIdx + 1;
        if (nextIdx >= programSteps.length) { stopProgram(); return; }
        programStepIdx = nextIdx;
        const ns = programSteps[nextIdx];
        programCurrentBpm = ns.startBpm;
        programTimer = Math.round(ns.intervalMin * 60);
      } else {
        programCurrentBpm = nextBpm;
        programTimer = Math.round(step.intervalMin * 60);
      }
      bpm = programCurrentBpm; updateBpm();
    }
    updateProgStatus();
  }, 1000);
}

function stopProgram() {
  programActive = false;
  clearInterval(programInterval);
  updateProgStatus();
  document.getElementById('prog-action').className = 'prog-start';
  document.getElementById('prog-action').textContent = '▶ Iniciar programa';
}

// ── Tap ───────────────────────────────────────────────────────────────────────
function tap() {
  const now = Date.now();
  tapTimes = [...tapTimes, now].filter(t => now - t < 3000).slice(-8);
  if (tapTimes.length >= 2) {
    const diffs = tapTimes.slice(1).map((t, i) => t - tapTimes[i]);
    const avg = diffs.reduce((a, b) => a + b, 0) / diffs.length;
    bpm = Math.max(30, Math.min(250, Math.round(60000 / avg)));
    updateBpm();
  }
}

// ── Init ──────────────────────────────────────────────────────────────────────
buildBeats(); buildSubdivDots(); buildPresets(); buildSounds(); buildSubdivs(); buildSigs(); renderProgramSteps();

document.getElementById('bpm-down').onclick = () => { bpm = Math.max(30, bpm-1); updateBpm(); };
document.getElementById('bpm-up').onclick = () => { bpm = Math.min(250, bpm+1); updateBpm(); };
document.getElementById('bpm-slider').oninput = e => { bpm = parseInt(e.target.value); updateBpm(); };
document.getElementById('play-btn').onclick = togglePlay;
document.getElementById('tap-btn').onclick = tap;
document.getElementById('prog-toggle').onclick = () => {
  progOpen = !progOpen;
  document.getElementById('prog-body').classList.toggle('open', progOpen);
  document.getElementById('prog-toggle').textContent = (progOpen ? '▲' : '▼') + '   Programación de Tempo';
};
document.getElementById('prog-add').onclick = () => {
  programSteps.push({ startBpm: 100, endBpm: 140, stepBpm: 5, direction: 'up', intervalMin: 2 });
  renderProgramSteps();
};
document.getElementById('prog-action').onclick = () => {
  if (programActive) stopProgram();
  else { startProgram(); if (!isPlayingRef) start(); }
};

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  if (e.code === 'KeyT') tap();
  if (e.code === 'ArrowUp') { e.preventDefault(); bpm = Math.min(250, bpm+1); updateBpm(); }
  if (e.code === 'ArrowDown') { e.preventDefault(); bpm = Math.max(30, bpm-1); updateBpm(); }
});
